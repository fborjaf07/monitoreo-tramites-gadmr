name: Actualizar Tramites GADMR

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install playwright openpyxl
          playwright install chromium
          playwright install-deps chromium

      - name: Ejecutar script
        env:
          EDOC_USUARIO: ${{ secrets.EDOC_USUARIO }}
          EDOC_CONTRASENA: ${{ secrets.EDOC_CONTRASENA }}
        run: python extraer_tramites.py

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tramites_todos.json alertas.json
          git diff --staged --quiet || git commit -m "Actualizacion automatica"
          git push
